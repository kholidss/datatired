[package]
name = "DataTired"
version = "0.1.1"
edition = "2024"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["svg"] }
libc = "0.2.190"
mongodb = { version = "3", features = ["sync"] }
native-tls = "0.2.18"
postgres = "0.19.14"
postgres-native-tls = "0.5.3"
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot", "eframe"] }
resvg = "0.45"

# egui/epaint/wgpu unoptimized make `cargo run` UI crawl; optimize deps only so app code still builds fast
[profile.dev.package."*"]
opt-level = 2
