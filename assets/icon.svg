<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="140" y1="110" x2="900" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2FB7C4"/>
